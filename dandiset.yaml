description: "Recordings from the lateral geniculate nucleus (LGN) during the presentation
  of a range of visual stimuli: natural movies, white-noise patterns and full-field
  flicker, each presented at two or more contrast levels, both as long non-repeating
  sequences and as many repetitions of short clips. This combination of stimulus types,
  contrasts and repeated presentations makes the dataset useful for both information-theoretic
  analyses and statistical modeling. This dataset supported four published studies,
  which examined the timescales and temporal precision of spike trains during natural
  vision, the organization of LGN spike trains into episodic spiking events, adaptation
  to stimulus contrast and spatiotemporal statistics, and how excitation and suppression
  shape spike timing in models of LGN processing (Lesica et al. 2007; Butts et al.
  2007, 2010, 2011). Repeated presentations allow response reliability and information
  rates to be measured directly, while long unique sequences allow receptive fields
  and encoding models to be fit and tested on held-out data.<p>&nbsp;</p>'**Organization
  notes.** The composition of each experiment (and in some cases each penetration)
  was different, and we include a searchable table to locate desired conditions across
  the dataset. Also, because all stimuli were shared across relevant penetrations,
  a single stimulus library is included in Expt1 and must be included with all specific
  penetration data. We have separately made python tools and a notebook to demonstrate
  how to search for and load different types of data in the DataProcessing directory
  at https://github.com/NeuroTheoryUMD/LGNcoding.git."
